# skein.ssemarket.cn → 本机控制面。放进 nginx_proxy 的 custom.conf 后先 nginx -t 再 reload。
# 证书：certbot certonly --webroot -w /var/www/certbot -d skein.ssemarket.cn

server {
    listen 80;
    server_name skein.ssemarket.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name skein.ssemarket.cn;

    ssl_certificate     /etc/letsencrypt/live/skein.ssemarket.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skein.ssemarket.cn/privkey.pem;

    location / {
        proxy_pass http://host.docker.internal:7800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE：/internal/stream 不能缓冲
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
    }

    location /api/agent/channel {
        proxy_pass http://host.docker.internal:7800;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
